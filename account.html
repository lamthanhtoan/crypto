<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Lịch sử giao dịch - TPBank</title>
    <style>
        body {
            margin: 0;
            font-family: "Segoe UI", Arial, sans-serif;
            background: #f4f0fb;
        }

        /* Header */
        .header {
            background: linear-gradient(135deg, #5a2ea6, #7b3fe4);
            color: white;
            padding: 22px;
            font-size: 22px;
            font-weight: bold;
        }

        .sub {
            font-size: 14px;
            opacity: 0.9;
        }

        .container {
            padding: 20px;
        }

        /* Card */
        .card {
            background: white;
            border-radius: 18px;
            padding: 25px;
            box-shadow: 0 12px 25px rgba(90,46,166,0.2);
            max-width: 420px;
            margin: auto;
        }

        .card h2 {
            margin: 0 0 10px;
            color: #5a2ea6;
        }

        .info {
            color: #444;
            margin-bottom: 25px;
        }

        /* Nút */
        .btn {
            width: 100%;
            padding: 16px;
            font-size: 18px;
            font-weight: bold;
            border: none;
            border-radius: 14px;
            background: linear-gradient(135deg, #7b3fe4, #5a2ea6);
            color: white;
            cursor: pointer;
            box-shadow: 0 8px 18px rgba(123,63,228,0.45);
        }

        .btn:active {
            transform: scale(0.96);
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.65);
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: white;
            padding: 50px;
            border-radius: 24px;
            text-align: center;
            animation: pop 0.25s ease;
            box-shadow: 0 15px 40px rgba(0,0,0,0.35);
        }

        /* CHỮ ĐỎ – TO – NHẤP NHÁY */
        .alert-text {
            font-size: 60px;
            font-weight: 900;
            color: red;
            animation: blink 0.6s infinite, zoom 1.2s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        @keyframes zoom {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        @keyframes pop {
            from { transform: scale(0.7); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body>

    <div class="header">
        TPBank
        <div class="sub">Ngân hàng Tiên Phong</div>
    </div>

    <div class="container">
        <div class="card">
            <h2>Lịch sử giao dịch</h2>
            <div class="info">
                Chủ tài khoản: <b>Lâm Thanh Toàn</b>
            </div>

            <button class="btn" onclick="openModal()">XEM GIAO DỊCH</button>
        </div>
    </div>

    <!-- Modal -->
    <div class="modal" id="modal" onclick="closeModal()">
        <div class="modal-content">
            <div class="alert-text">
                Đụ mẹ mầy,Bố Mầy đẻ được mầy
            </div>
        </div>
    </div>

    <script>
        function openModal() {
            document.getElementById("modal").style.display = "flex";
        }

        function closeModal() {
            document.getElementById("modal").style.display = "none";
        }
    </script>

</body>
</html>
